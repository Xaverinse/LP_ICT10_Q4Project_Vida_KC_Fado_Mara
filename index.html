<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>CLASSLIST!!!</title>
    <style>
body {
    font-family: 'Trebuchet MS', Arial, sans-serif;
    background-color: #965FD4;
    color: #FFB600;
        }

.container-box {
    background: #0D0D0D;
    border-radius: 20px;
    box-shadow: 0 6px 16px #FFB600;
    max-width: 500px;
    padding: 40px;
    margin: 80px auto;
    border: 2px solid #B59D73;
    text-align: center;
        }

h1, h2 {
    color: #66FE00;
        }

input {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border-radius: 8px;
    border: 1px solid #66FE00;
    color: #FF0000;
        }

.btn-group {
    display: flex;
     gap: 10px;
    justify-content: center;
        }

button {
    padding: 10px 15px;
    background-color: #FF0000;
    border-radius: 8px;
    color:#FFB600
    font-weight: 600;
        }

button:hover {
    background-color: #965FD4;
        }

.output-box {
    margin-top: 20px;
    padding: 15px;
    background-color: #FAFAFA;
    border-radius: 10px;
    border: 3px solid #66FE00;
    text-align: center;
    color:#FF0000;
    max-height: 300px;
    overflow-y: auto;
    font-weight: 500;
    line-height: 1.8;
        }

.navbar {
    background: #0D0D0D;
    border: 1px solid #B59D73;
    border-radius: 8px;
     box-shadow: 0 2px 16px #965FD4;
}

.navbar-brand,
.nav-link {
    color: #FFB600 !important;
    font-weight: 600;
}

.nav-link.active {
    text-decoration: underline;
}


.logoimg {
    height: 40px;
    margin-right: 10px;
}
    </style>
</head>

<body>
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
            <img src="NERV_Logo.webp" alt="logo" class="logoimg" style="border-radius: 50%; width: 40px; height: 40px; border: 2px solid #FF0000;">
            S.Y. 2025-2026
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="tracker.html">Attendance Tracker</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="images.html">Highlights</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-box">
    <h1>My Classmates</h1>
    <h2>Class of 25–26</h2>

    <input type="text" id="username" placeholder="Name">
    <input type="text" id="section" placeholder="Section">
    <input type="text" id="fav" placeholder="Favorite Character">

    <div class="btn-group">
        <button py-click="AddClassmate">Add New Classmate</button>
        <button py-click="ShowClassmates">Show Classlist</button>
    </div>

    <div class="output-box" id="signed"></div>
    <div class="output-box" id="classmate-list"></div>
</div>

<script type="py" src="main.py"></script>

</body>
</html>
