<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <py-config>
        packages = ["numpy", "matplotlib"]
    </py-config>
    <title>Attendance Tracker</title>
    <style>
        .matplotlib-title {
        display: none;
    }
    body {
    font-family: 'Trebuchet MS', Arial, sans-serif;
    background-color: #965FD4;
    color: #FFB600;
        }

.container-box {
    background: #0D0D0D;
    border-radius: 20px;
    box-shadow: 0 6px 16px #FFB600;
    max-width: 500px;
    padding: 40px;
    margin: 80px auto;
    border: 2px solid #B59D73;
    text-align: center;
        }

h1, h2 {
    color: #66FE00;
        }

input {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border-radius: 8px;
    border: 1px solid #66FE00;
        }

.btn-group {
    display: flex;
     gap: 10px;
    justify-content: center;
        }

button {
    padding: 10px 15px;
    background-color: #FF0000;
    border-radius: 8px;
    color:#FFB600
    font-weight: 600px;}

select {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border-radius: 8px;
    border: 1px solid #66FE00;
        }

button:hover {
    background-color: #965FD4;
        }

.output-box {
    margin-top: 20px;
    padding: 15px;
    background-color: #fff7e6;
    border-radius: 10px;
    border: 1px solid #66FE00;
    text-align: center;
    color:#FFB600;
        }

.navbar {
    background: #0D0D0D;
    border: 1px solid #B59D73;
    border-radius: 8px;
     box-shadow: 0 2px 16px #965FD4;
}

.navbar-brand,
.nav-link {
    color: #FFB600 !important;
    font-weight: 600;
}

.nav-link.active {
    text-decoration: underline;
}


.logoimg {
    height: 40px;
    margin-right: 10px;
}
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
            <img src="NERV_Logo.webp" alt="logo" class="logoimg" style="border-radius: 50%; width: 40px; height: 40px; border: 2px solid #FF0000;">
            S.Y. 2025-2026
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="tracker.html">Attendance Tracker</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="images.html">Highlights</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-box">
    <h1>Weekly Attendance Tracker</h1>

    <label>Day:</label>
    <select name="dayInput" id="dayInput">
        <option value="NONE" disabled selected>Select a Day</option>
        <option value="Monday">Monday</option>
        <option value="Tuesday">Tuesday</option>
        <option value="Wednesday">Wednesday</option>
        <option value="Thursday">Thursday</option>
        <option value="Friday">Friday</option>
      </select>

    <br><br>

    <label>Number of Absences:</label>
    <input type="number" id="absenceInput" placeholder="e.g. 3">

    <br><br>

    <button py-click="displaying">Submit</button>
</div>

    <br><br>
    <script type="py" src="main2.py"></script>
</body>
</html>
